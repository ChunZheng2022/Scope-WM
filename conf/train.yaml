defaults:
  - _self_
  - env: point_maze
  - encoder: dino 
  - action_encoder: proprio
  - proprio_encoder: proprio
  - decoder: vqvae
  - predictor: vit
  - override hydra/launcher: submitit_slurm

# base path to save model outputs. Checkpoints will be saved to ${ckpt_base_path}/outputs.
ckpt_base_path: ./ # put absolute path here
data_path: null # optional override for env.dataset.data_path

hydra:
  run:
    dir: ${ckpt_base_path}/outputs/${now:%Y-%m-%d}/${now:%H-%M-%S}
  sweep:
    dir: ${ckpt_base_path}/outputs/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: ${hydra.job.num}
  launcher:
    submitit_folder: ${hydra.sweep.dir}/.submitit/%j
    nodes: 1
    tasks_per_node: 1
    cpus_per_task: 8
    mem_gb: 512
    gres: "gpu:h100:1"
    timeout_min: 2880
    setup: ["export DEBUGVAR=$(scontrol show hostnames $SLURM_JOB_NODELIST)",
            export MASTER_ADDR="$(scontrol show hostnames $SLURM_JOB_NODELIST | head -n 1)",
            "export MASTER_PORT=$(for port in $(shuf -i 30000-65500 -n 20); do if [[ $(netstat -tupln 2>&1 | grep $port | wc -l) -eq 0 ]] ; then echo $port; break; fi; done;)",]

training:
  seed: 0
  epochs: 100
  batch_size: 32 # should >= nodes * tasks_per_node
  save_every_x_epoch: 1
  save_every_x_batch: 5000 # set 0/null to disable intra-epoch checkpoints
  reconstruct_every_x_batch: 500
  num_reconstruct_samples: 6
  encoder_lr: 1e-6
  decoder_lr: 3e-4
  predictor_lr: 5e-4
  action_encoder_lr: 5e-4

img_size: 224 # should be a multiple of 224
frameskip: 5
concat_dim: 1

normalize_action: True

# action encoder
action_emb_dim: 10
num_action_repeat: 1

# proprio encoder
proprio_emb_dim: 10 
num_proprio_repeat: 1

num_hist: 3
num_pred: 1 # only supports 1
has_predictor: True # set this to False for only training a decoder
has_decoder: True # set this to False for only training a predictor
resume_checkpoint: null # optional path to model_latest.pth or model_batch_latest.pth
init_checkpoint: null # optional checkpoint for finetuning in a new run
init_checkpoint_load_decoder: false

use_drs: false
drs_mode: "none"
drs_keep_ratio: 1.0
drs_topk: null
drs_action_aware: true
drs_mask_type: "mask" # mask, grouped, or prune
drs_detach_score: true
drs_debug: false
drs_head_checkpoint: null
drs_group_size: 2

use_roi: false # legacy alias for use_drs
roi_mode: "none"
roi_keep_ratio: 1.0
roi_topk: null
roi_action_aware: true
roi_mask_type: "mask" # mask, grouped, or prune
roi_detach_score: true
roi_debug: false
roi_head_checkpoint: null
roi_group_size: 2

drs_distill:
  enabled: false
  teacher_checkpoint: null
  target_path: null
  output_dir: null
  target_type: "grad_x_input"
  loss_type: "kl"
  temperature: 1.0
  budget_loss_weight: 0.0
  action_conditioned: true
  freeze_world_model: true
  train_roi_head_only: true

roi_distill:
  enabled: false
  teacher_checkpoint: null
  target_path: null
  output_dir: null
  target_type: "grad_x_input"
  loss_type: "kl"
  temperature: 1.0
  budget_loss_weight: 0.0
  action_conditioned: true
  freeze_world_model: true
  train_roi_head_only: true

sparse_baseline:
  enabled: false
  modes: ["random", "fixed_random", "lhs", "attention_encoder", "attention_wm"]
  drop_ratios: [0.1, 0.3, 0.5, 0.7, 0.9]
  resample_each_mpc_iter: true
  save_masks: false

sparse_dynamics:
  enabled: false
  mode: "sparse_primary"
  mask_source: "drs" # drs/roi, dynamic_localizer, drs_union_dynamic, or drs_intersect_dynamic
  background_processor: "none" # none, ignore, grouped, ru, lrm, or fdbu
  background_group_size: 2
  foreground_keep_ratio: 1.0
  foreground_topk: null
  fill_mode: "carry_forward"
  loss_on_foreground_only: true
  ru_rank: 16
  ru_alpha: 1.0
  ru_dropout: 0.0
  lrm_heads: 4
  lrm_num_tokens: 196
  lrm_alpha: 1.0
  lrm_dropout: 0.0
  lrm_rank: 16 # legacy alias for ru_rank
  fdbu_hidden_dim: null
  fdbu_hidden_mult: 2.0
  fdbu_alpha: 1.0
  fdbu_dropout: 0.0
  cbu_hidden_dim: null # legacy alias for fdbu_hidden_dim
  cbu_hidden_mult: 2.0 # legacy alias for fdbu_hidden_mult
  cbu_alpha: 1.0 # legacy alias for fdbu_alpha
  cbu_dropout: 0.0 # legacy alias for fdbu_dropout
  dynamic_localizer_checkpoint: null
  dynamic_localizer_threshold: 0.5
  dynamic_localizer_min_tokens: 32

model:
  _target_: models.visual_world_model.VWorldModel
  image_size: ${img_size}
  num_hist: ${num_hist}
  num_pred: ${num_pred}
  train_encoder: False
  train_predictor: True
  train_decoder: True

debug: False 

# Planning params for planning eval jobs launched during training
plan_settings: 
  # plan_cfg_path: conf/plan.yaml # set to null for no planning evals
  plan_cfg_path: null 
  planner: ['gd', 'cem']
  goal_source: ['dset', 'random_state']
  goal_H: [5]
  alpha: [0.1, 1]
